<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F0">
<title>GLOW · 用一段短劇，抱抱今天的你</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }

:root{
  --bg:#FBF6F0;
  --surface:#FFFFFF;
  --text:#41362F;
  --text-mid:#6B5D53;
  --text-soft:#8A7E74;
  --text-light:#B3A69C;
  --line:#F2E7DD;
  --peach:#E9A48C;
  --peach-deep:#E08B72;
  --peach-soft:#FBF1E9;
  --sage:#A9C3B3;
  --radius:24px;
  --shadow: 0 18px 40px -24px rgba(160,120,95,.45), 0 2px 8px rgba(160,120,95,.06);
}

html{ -webkit-text-size-adjust:100%; }

body{
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang SC",
               "Hiragino Sans", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height:1.65;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

body::before,
body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:0;
  filter: blur(10px);
}
body::before{
  width:70vmax; height:70vmax;
  top:-32vmax; right:-24vmax;
  background: radial-gradient(circle, rgba(233,164,140,.30), rgba(233,164,140,0) 68%);
}
body::after{
  width:60vmax; height:60vmax;
  bottom:-30vmax; left:-22vmax;
  background: radial-gradient(circle, rgba(169,195,179,.26), rgba(169,195,179,0) 68%);
}

.app{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 22px; }

.view{ display:none; }
.view.active{ display:block; }

/* ---------- 品牌 ---------- */
.brand{
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.20em;
  color:#B98167;
  text-indent:.20em;
}
.brand::before{
  content:'';
  width:9px; height:9px;
  border-radius:50%;
  background:linear-gradient(135deg,#F0B89C,#E2907A);
  box-shadow:0 0 0 4px rgba(233,164,140,.18);
  flex:none;
}

/* ---------- 语言按钮 ---------- */
.lang-toggle{
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  color:#B98167;
  background:rgba(255,255,255,.8);
  border:1px solid var(--line);
  padding:6px 12px;
  border-radius:999px;
  cursor:pointer;
  transition: background .2s, transform .2s;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.lang-toggle:hover{ background:#fff; }
.lang-toggle:active{ transform:scale(.96); }

/* ---------- 欢迎页 ---------- */
#welcome.active{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100svh;
  padding:28px 0 60px;
}

.welcome-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 0 20px;
}

.welcome-inner{
  width:100%;
  max-width:580px;
  margin:auto;
  animation: fadeUp .6s cubic-bezier(.2,.8,.3,1) both;
}

h1.title{
  font-size: clamp(27px, 6vw, 38px);
  font-weight:800;
  line-height:1.32;
  letter-spacing:-.01em;
  margin:16px 0 14px;
  color:var(--text);
}
.hl{
  background: linear-gradient(180deg, transparent 60%, #F7DCCD 60%);
  padding:0 2px;
}

.sub{
  font-size:14.5px;
  color:var(--text-soft);
  max-width:450px;
  line-height:1.78;
}

/* 平台介绍卡 */
.intro-card{
  margin-top:20px;
  padding:16px 18px;
  background: rgba(255,255,255,.66);
  border:1px solid var(--line);
  border-radius:18px;
  font-size:13px;
  color:var(--text-mid);
  line-height:1.75;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.intro-card strong{ color:#B98167; font-weight:700; }
.intro-card .sdg{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:8px;
  font-size:11.5px;
  color:#8A9E8F;
  font-weight:600;
  letter-spacing:.02em;
}
.intro-card .sdg::before{
  content:'';
  width:6px; height:6px;
  border-radius:50%;
  background:var(--sage);
}

/* 表单 */
.card{
  margin-top:24px;
  padding:24px;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border:1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.field{ margin-bottom:17px; }
.field:last-child{ margin-bottom:0; }

.field > label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--text-mid);
  margin-bottom:9px;
  letter-spacing:.02em;
}
.opt{
  font-weight:400;
  font-size:12px;
  color:var(--text-light);
  margin-left:5px;
}

input{
  width:100%;
  padding:13px 16px;
  font-size:15px;
  font-family:inherit;
  color:var(--text);
  background:#FDFAF7;
  border:1.5px solid #F0E4D9;
  border-radius:14px;
  outline:none;
  transition: border-color .2s, background .2s, box-shadow .2s;
  -webkit-appearance:none;
}
input::placeholder{ color:#C6BAB0; }
input:focus{
  border-color: var(--peach);
  background:#fff;
  box-shadow:0 0 0 4px rgba(233,164,140,.14);
}
input.invalid{
  border-color:#E08B72;
  animation: shake .4s ease;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; }

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:17px;
}
.row .field{ margin-bottom:0; }

.chips{ display:flex; flex-wrap:wrap; gap:9px; }

.chip{
  font-family:inherit;
  font-size:13.5px;
  color:#7A6C61;
  background:#FBF3EC;
  border:1.5px solid transparent;
  padding:8px 15px;
  border-radius:999px;
  cursor:pointer;
  transition: background .18s, color .18s, transform .18s, box-shadow .18s;
  user-select:none;
  white-space:nowrap;
}
.chip:hover{ background:#F7E8DD; }
.chip:active{ transform:scale(.96); }
.chip.active{
  background:linear-gradient(135deg,#F3C5B0,#E9A48C);
  color:#fff;
  box-shadow:0 7px 16px -7px rgba(217,139,114,.85);
}

.hint{
  min-height:20px;
  margin-top:2px;
  font-size:12.5px;
  color:#D98B72;
  font-weight:500;
}

.btn-primary{
  width:100%;
  margin-top:6px;
  padding:15px;
  font-family:inherit;
  font-size:15.5px;
  font-weight:600;
  letter-spacing:.05em;
  color:#fff;
  background:linear-gradient(135deg,#EFA98F,#E08B72);
  border:none;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 14px 26px -14px rgba(217,139,114,.95);
  transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
}
.btn-primary:hover{
  transform:translateY(-1px);
  filter:brightness(1.03);
  box-shadow:0 18px 32px -14px rgba(217,139,114,1);
}
.btn-primary:active{ transform:translateY(1px) scale(.995); }

/* ---------- 首页 ---------- */
#home.active{
  display:block;
  padding:22px 0 80px;
  animation: fadeUp .5s cubic-bezier(.2,.8,.3,1) both;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 0 22px;
  gap:12px;
}
.topbar-right{ display:flex; align-items:center; gap:9px; }

.user-pill{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 7px 6px 15px;
  background:rgba(255,255,255,.82);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:13.5px;
  color:var(--text-mid);
  cursor:pointer;
  transition: box-shadow .2s, transform .2s;
}
.user-pill:hover{
  box-shadow:0 10px 22px -14px rgba(160,120,95,.7);
  transform:translateY(-1px);
}
.avatar{
  width:29px; height:29px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#F0B89C,#E2907A);
  flex:none;
}

.hero h2{
  font-size: clamp(22px, 4.6vw, 30px);
  font-weight:800;
  letter-spacing:-.01em;
  color:var(--text);
}
.hero p{
  font-size:14.5px;
  color:var(--text-soft);
  margin-top:7px;
}

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:20px 2px 8px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.filters::-webkit-scrollbar{ display:none; }
.filters .chip{ flex:none; }

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(234px, 1fr));
  gap:18px;
  margin-top:16px;
}

.drama{
  background:var(--surface);
  border:1px solid #F5EBE2;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 8px 20px -14px rgba(160,120,95,.55);
  transition: transform .24s cubic-bezier(.2,.7,.3,1), box-shadow .24s;
  animation: fadeUp .5s cubic-bezier(.2,.8,.3,1) both;
  display:flex;
  flex-direction:column;
}
.drama:hover{
  transform:translateY(-4px);
  box-shadow:0 24px 36px -20px rgba(160,120,95,.65);
}
.drama:active{ transform:translateY(-1px) scale(.99); }

.cover{
  position:relative;
  aspect-ratio: 16 / 10;
  display:grid;
  place-items:center;
  flex:none;
}
.cover::after{
  content:'';
  position:absolute;
  inset:0;
  background: radial-gradient(circle at 76% 20%, rgba(255,255,255,.6), transparent 58%);
  pointer-events:none;
}
.cover .emoji{
  font-size:40px;
  filter: drop-shadow(0 6px 10px rgba(120,90,70,.16));
  transform: translateY(1px);
}

.badge-dur,
.badge-topic{
  position:absolute;
  z-index:1;
  font-size:11px;
  letter-spacing:.02em;
  padding:3px 10px;
  border-radius:999px;
  color:#7A6C61;
  background:rgba(255,255,255,.78);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.badge-dur{ top:10px; right:10px; }
.badge-topic{ left:10px; bottom:10px; }

.drama .body{ padding:12px 14px 15px; flex:1; display:flex; flex-direction:column; }
.drama h3{
  font-size:15px;
  font-weight:600;
  color:var(--text);
  line-height:1.45;
}
.drama p{
  font-size:12.5px;
  color:#9C8F85;
  line-height:1.6;
  margin-top:5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.empty{
  grid-column:1 / -1;
  text-align:center;
  padding:70px 20px;
  color:var(--text-light);
  font-size:14px;
}

/* ---------- 播放器 ---------- */
#player.active{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100svh;
  padding:18px 0 40px;
  animation: fadeUp .4s cubic-bezier(.2,.8,.3,1) both;
}

.player-top{
  display:flex;
  align-items:center;
  gap:12px;
  padding:6px 0 18px;
}

.back-btn{
  width:38px; height:38px;
  display:grid;
  place-items:center;
  font-size:19px;
  color:#7A6C61;
  background:rgba(255,255,255,.85);
  border:1px solid var(--line);
  border-radius:50%;
  cursor:pointer;
  flex:none;
  transition: background .2s, transform .2s;
}
.back-btn:hover{ background:#fff; }
.back-btn:active{ transform:scale(.94); }

.player-meta{ flex:1; min-width:0; }
.player-meta .p-title{
  font-size:15px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.player-meta .p-step{
  font-size:11.5px;
  color:var(--text-light);
  letter-spacing:.03em;
  margin-top:1px;
}

.scene-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  max-width:640px;
  width:100%;
  margin:0 auto;
  padding:8px 0 24px;
}

/* ---------- 视频舞台（9:16） ---------- */
.video-stage{
  display:flex;
  justify-content:center;
  margin: 4px 0 18px;
}

.video-frame{
  position:relative;
  height: min(56vh, 580px);
  max-width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 18px;
  overflow:hidden;
  background:#2A2320;
  box-shadow: 0 18px 40px -24px rgba(0,0,0,.5);
}

.video-frame video{
  width:100%;
  height:100%;
  object-fit: cover;
  display:block;
  background:#2A2320;
}

.video-overlay{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background: rgba(40,32,28,.32);
  cursor:pointer;
  transition: opacity .3s ease, background .2s;
  z-index:2;
}
.video-overlay:hover{ background: rgba(40,32,28,.44); }
.video-overlay.hidden{ opacity:0; pointer-events:none; }

.video-play-btn{
  width:64px;
  height:64px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:22px;
  color:#fff;
  background: linear-gradient(135deg,#EFA98F,#E08B72);
  box-shadow:0 10px 24px -8px rgba(217,139,114,.9);
  transition: transform .2s;
  padding-left:4px;
}
.video-play-btn:hover{ transform:scale(1.06); }
.video-play-btn:active{ transform:scale(.96); }

.skip-video{
  display:block;
  margin: -4px auto 4px;
  font-family:inherit;
  font-size:12.5px;
  color:#B3A69C;
  background:none;
  border:none;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px;
  padding:6px 10px;
}
.skip-video:hover{ color:#B98167; }

/* ---------- 场景文字 ---------- */
.scene-text{
  max-width:560px;
  margin: 0 auto;
  text-align:center;
  font-size: clamp(15px, 2.2vw, 17px);
  line-height:1.85;
  color:var(--text);
  letter-spacing:.01em;
  animation: fadeUp .45s cubic-bezier(.2,.8,.3,1) both;
}
.scene-text em{
  font-style:normal;
  color:#B98167;
  font-weight:600;
}

/* ---------- 选项 ---------- */
.choices{
  margin: 18px auto 0;
  max-width:560px;
  display:flex;
  flex-direction:column;
  gap:10px;
  opacity:0;
  pointer-events:none;
  transition: opacity .4s ease;
}
.choices.show{
  opacity:1;
  pointer-events:auto;
}

.choice-btn{
  width:100%;
  text-align:left;
  font-family:inherit;
  font-size:14.5px;
  line-height:1.55;
  color:var(--text-mid);
  background:#fff;
  border:1.5px solid #F0E4D9;
  border-radius:16px;
  padding:15px 18px;
  cursor:pointer;
  transition: border-color .2s, background .2s, transform .18s, box-shadow .2s;
  display:flex;
  align-items:flex-start;
  gap:12px;
}
.choice-btn .idx{
  flex:none;
  width:22px; height:22px;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:700;
  color:#B98167;
  background:var(--peach-soft);
  border-radius:50%;
  margin-top:1px;
}
.choice-btn:hover{
  border-color:#EFC9B8;
  background:#FFFBF8;
  transform:translateY(-1px);
  box-shadow:0 12px 22px -16px rgba(160,120,95,.6);
}
.choice-btn:active{ transform:scale(.995); }

/* ---------- 结局 ---------- */
.ending-wrap{
  max-width:640px;
  width:100%;
  margin:0 auto;
  padding: 4px 0 20px;
  animation: fadeUp .5s cubic-bezier(.2,.8,.3,1) both;
}

.ending-content{
  transition: opacity .5s ease;
}

.ending-text{
  font-size:clamp(15.5px, 2.2vw, 17px);
  line-height:1.9;
  color:var(--text);
  padding:20px 22px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 8px 22px -18px rgba(160,120,95,.5);
  text-align:center;
}

.section-block{
  margin-top:18px;
  padding:20px 22px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 8px 22px -18px rgba(160,120,95,.4);
}
.section-block .s-label{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.08em;
  color:#B98167;
  text-transform:uppercase;
  margin-bottom:10px;
}
.section-block .s-label::before{
  content:'';
  width:6px; height:6px;
  border-radius:50%;
  background:var(--peach);
}
.section-block p{
  font-size:14px;
  line-height:1.8;
  color:var(--text-mid);
}
.section-block ul{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.section-block li{
  padding-left:0;
}

.res-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #F6EDE5;
  text-decoration:none;
  color:var(--text-mid);
  font-size:13.5px;
  transition: color .2s;
}
.res-link:last-child{ border-bottom:none; }
.res-link:hover{ color:#B98167; }
.res-link .arrow{
  color:#D9CCC1;
  font-size:15px;
  flex:none;
  transition: transform .2s;
}
.res-link:hover .arrow{ transform:translateX(3px); color:#E9A48C; }
.res-link .r-name{ font-weight:500; }
.res-link .r-sub{
  display:block;
  font-size:11px;
  color:var(--text-light);
  margin-top:1px;
}

.ending-actions{
  margin-top:24px;
  display:flex;
  gap:11px;
}
.btn-ghost{
  flex:1;
  padding:13px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  color:#9A8B7F;
  background:#fff;
  border:1.5px solid #F0E4D9;
  border-radius:14px;
  cursor:pointer;
  transition: background .2s, border-color .2s;
}
.btn-ghost:hover{ background:#FFFBF8; border-color:#EFC9B8; }
.btn-ghost:active{ transform:scale(.99); }

/* ---------- 动画 ---------- */
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(16px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  22%{ transform:translateX(-5px); }
  44%{ transform:translateX(5px); }
  66%{ transform:translateX(-3px); }
  88%{ transform:translateX(3px); }
}

/* ---------- 响应式 ---------- */
@media (max-width:600px){
  .app{ padding:0 16px; }
  #welcome.active{ padding:18px 0 48px; }
  .card{ padding:20px 17px; border-radius:20px; }
  h1.title{ font-size:26px; margin:14px 0 11px; }
  .row{ grid-template-columns:1fr; gap:15px; }
  .grid{
    grid-template-columns:1fr 1fr;
    gap:13px;
    margin-top:14px;
  }
  .drama{ border-radius:16px; }
  .cover .emoji{ font-size:32px; }
  .drama .body{ padding:10px 11px 13px; }
  .drama h3{ font-size:13px; }
  .drama p{ font-size:11px; -webkit-line-clamp:2; }
  .badge-dur, .badge-topic{ font-size:10px; padding:2px 7px; }
  .hero h2{ font-size:21px; }
  .scene-text{ font-size:15px; line-height:1.85; }
  .choice-btn{ padding:13px 14px; font-size:13.5px; gap:10px; }
  .section-block{ padding:17px 16px; }
  .ending-text{ padding:17px 16px; }
  .ending-actions{ flex-direction:column; }
  .video-frame{ height: min(58vh, 520px); }
  .video-play-btn{ width:56px; height:56px; font-size:19px; }
}

@media (max-width:370px){
  .grid{ grid-template-columns:1fr; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= 欢迎页 / 设置 ================= -->
  <section class="view active" id="welcome">
    <div class="welcome-top">
      <div class="brand">GLOW</div>

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function T(obj){
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[state.lang] || obj.en || obj.zh || '';
}

function topicLabel(id){
  const t = TOPICS.find(x => x.id === id);
  return t ? T(t) : id;
}

function applyStaticLang(){
  $('#welcomeTitle').innerHTML = T(TXT.welcomeTitle);
  $('#welcomeSub').textContent = T(TXT.welcomeSub);
  $('#introCard').innerHTML = T(TXT.intro);

  $('#labelNick').innerHTML = T(TXT.labelNick);
  $('#nickname').placeholder = T(TXT.placeholderNick);
  $('#labelAge').innerHTML = T(TXT.labelAge);
  $('#age').placeholder = T(TXT.placeholderAge);
  $('#labelReal').innerHTML = T(TXT.labelReal);
  $('#realname').placeholder = T(TXT.placeholderReal);
  $('#labelTopics').innerHTML = T(TXT.labelTopics);
  $('#startBtn').textContent = T(TXT.startBtn);

  $('#greetLine').innerHTML = T(TXT.greetLine).replace('{name}', state.nickname || '');
  $('#greetSub').textContent = T(TXT.greetSub);
  $('#userPill').title = state.lang === 'zh' ? '點擊修改個人信息' : 'Click to edit your info';

  $$('.lang-toggle').forEach(btn => {
    btn.textContent = state.lang === 'zh' ? 'EN' : '繁';
  });

  renderTopicChips();
  renderFilters();
  renderGrid();

  // 如果正在播放器页，刷新当前场景
  if (state.currentDrama && $('#player').classList.contains('active')){
    renderScene();
  }
}

function toggleLang(){
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  applyStaticLang();
}

$('#langToggle1').addEventListener('click', toggleLang);
$('#langToggle2').addEventListener('click', toggleLang);

/* =====================================================
   5. 话题 chips
   ===================================================== */
function renderTopicChips(){
  const el = $('#topicChips');
  el.innerHTML = TOPICS.map(t => {
    const active = state.topics.includes(t.id) ? 'active' : '';
    return `<button type="button" class="chip ${active}" data-topic="${t.id}">${T(t)}</button>`;
  }).join('');
}

$('#topicChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const id = chip.dataset.topic;
  const idx = state.topics.indexOf(id);
  if (idx >= 0){ state.topics.splice(idx, 1); }
  else { state.topics.push(id); }
  chip.classList.toggle('active');
  $('#hint').textContent = '';
});

/* =====================================================
   6. 提交表单
   ===================================================== */
$('#setupForm').addEventListener('submit', (e) => {
  e.preventDefault();

  const nickEl = $('#nickname');
  const ageEl = $('#age');
  const hint = $('#hint');

  const nickname = nickEl.value.trim();
  const age = ageEl.value.trim();
  const realname = $('#realname').value.trim();

  nickEl.classList.remove('invalid');
  ageEl.classList.remove('invalid');

  if (!nickname){
    hint.textContent = T(TXT.hintNick);
    nickEl.classList.add('invalid');
    nickEl.focus();
    return;
  }
  if (!age || Number(age) < 18 || Number(age) > 27){
    hint.textContent = T(TXT.hintAge);
    ageEl.classList.add('invalid');
    ageEl.focus();
    return;
  }
  if (state.topics.length === 0){
    hint.textContent = T(TXT.hintTopics);
    return;
  }

  state.nickname = nickname;
  state.age = age;
  state.realname = realname;

  hint.textContent = '';
  enterHome();
});

/* =====================================================
   7. 首页
   ===================================================== */
function enterHome(){
  $('#welcome').classList.remove('active');
  $('#home').classList.add('active');
  window.scrollTo({ top: 0 });

  $('#pillName').textContent = state.nickname;
  $('#greetLine').innerHTML = T(TXT.greetLine).replace('{name}', state.nickname);
  $('#avatar').textContent = state.nickname.slice(0, 1);

  renderFilters();
  renderGrid();
}

$('#userPill').addEventListener('click', () => {
  $('#home').classList.remove('active');
  $('#welcome').classList.add('active');
  window.scrollTo({ top: 0 });
});

/* =====================================================
   8. 筛选栏
   ===================================================== */
function renderFilters(){
  const el = $('#filters');
  const items = [{ id:'all', zh: TXT.filterAll.zh, en: TXT.filterAll.en }, ...TOPICS];
  el.innerHTML = items.map(t => {
    const active = state.filter === t.id ? 'active' : '';
    return `<button class="chip filter-btn ${active}" data-filter="${t.id}">${T(t)}</button>`;
  }).join('');
}

$('#filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  state.filter = btn.dataset.filter;
  renderFilters();
  renderGrid();
});

/* =====================================================
   9. 短剧卡片
   ===================================================== */
function renderGrid(){
  const grid = $('#grid');
  let list = DRAMAS.slice();

  if (state.filter !== 'all'){
    list = list.filter(d => d.topic === state.filter);
  } else {
    const match = list.filter(d => state.topics.includes(d.topic));
    const rest  = list.filter(d => !state.topics.includes(d.topic));
    list = [...match, ...rest];
  }

  if (list.length === 0){
    grid.innerHTML = `<div class="empty">${T(TXT.emptyGrid)}</div>`;
    return;
  }

  grid.innerHTML = list.map((d, i) => `
    <article class="drama" data-id="${d.id}" style="animation-delay:${i * 45}ms">
      <div class="cover" style="background:linear-gradient(140deg, ${d.c1}, ${d.c2})">
        <span class="emoji">${d.emoji}</span>
        <span class="badge-dur">${d.duration}</span>
        <span class="badge-topic">${topicLabel(d.topic)}</span>
      </div>
      <div class="body">
        <h3>${T(d.title)}</h3>
        <p>${T(d.synopsis)}</p>
      </div>
    </article>
  `).join('');
}

$('#grid').addEventListener('click', (e) => {
  const card = e.target.closest('.drama');
  if (!card) return;
  startDrama(card.dataset.id);
});

/* =====================================================
   10. 播放器
   ===================================================== */
function startDrama(id){
  const d = DRAMAS.find(x => x.id === id);
  if (!d) return;
  state.currentDrama = d;
  state.currentScene = 0;
  state.history = [];

  $('#home').classList.remove('active');
  $('#player').classList.add('active');
  window.scrollTo({ top: 0 });

  $('#pTitle').textContent = T(d.title);
  renderScene();
}

$('#backBtn').addEventListener('click', () => {
  $('#player').classList.remove('active');
  $('#home').classList.add('active');
  state.currentDrama = null;
  window.scrollTo({ top: 0 });
});

/* ---------- 渲染场景 ---------- */
function renderScene(){
  const d = state.currentDrama;
  if (!d) return;
  const scene = d.scenes[state.currentScene];
  if (!scene) return;

  if (scene.ending){
    $('#pStep').textContent = state.lang === 'zh' ? '結局' : 'Ending';
  } else {
    const n = state.currentScene + 1;
    const total = d.scenes.length - 1;
    $('#pStep').textContent = state.lang === 'zh'
      ? `第 ${n} 幕 / ${total}`
      : `Scene ${n} of ${total}`;
  }

  const coverHtml = `<div class="scene-cover" style="background:linear-gradient(140deg, ${d.c1}, ${d.c2})">${d.emoji}</div>`;

  if (scene.ending){
    renderEndingScene(scene, coverHtml);
  } else {
    renderNormalScene(scene);
  }
}

/* ---------- 普通场景 ---------- */
function renderNormalScene(scene){
  const wrap = $('#sceneWrap');
  const hasVideo = !!scene.video;

  const choicesHtml = (scene.choices || []).map((c, i) => `
    <button class="choice-btn" data-next="${c.next}">
      <span class="idx">${i + 1}</span>
      <span>${T(c)}</span>
    </button>
  `).join('');

  if (hasVideo){
    wrap.innerHTML = `
      <div class="video-stage">
        <div class="video-frame">
          <video id="sceneVideo" src="${scene.video}" playsinline controls preload="metadata"></video>
          <div class="video-overlay" id="videoOverlay">
            <button class="video-play-btn" id="videoPlayBtn" aria-label="播放">▶</button>
          </div>
        </div>
      </div>
      <div class="scene-text">${T(scene.text)}</div>
      <button class="skip-video" id="skipVideoBtn">${state.lang==='zh'?'跳過視頻 →':'Skip video →'}</button>
      <div class="choices" id="choiceArea">
        ${choicesHtml}
      </div>
    `;
    setupVideoScene();
  } else {
    wrap.innerHTML = `
      <div class="scene-text">${T(scene.text)}</div>
      <div class="choices show" id="choiceArea">
        ${choicesHtml}
      </div>
    `;
    bindChoices();
  }
}

function setupVideoScene(){
  const video = $('#sceneVideo');
  const overlay = $('#videoOverlay');
  const choiceArea = $('#choiceArea');
  const skipBtn = $('#skipVideoBtn');

  function showChoices(){
    choiceArea.classList.add('show');
    if (skipBtn) skipBtn.style.display = 'none';
  }

  function playVideo(){
    overlay.classList.add('hidden');
    const p = video.play();
    if (p && p.catch){
      p.catch(() => overlay.classList.remove('hidden'));
    }
  }

  $('#videoPlayBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    playVideo();
  });
  overlay.addEventListener('click', playVideo);

  video.addEventListener('ended', showChoices);
  video.addEventListener('error', () => {
    // 视频未上传或加载失败时，直接显示选项，方便测试流程
    overlay.classList.add('hidden');
    showChoices();
  });

  if (skipBtn){
    skipBtn.addEventListener('click', showChoices);
  }

  bindChoices();
}

function bindChoices(){
  const choiceArea = $('#choiceArea');
  if (!choiceArea) return;
  choiceArea.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const next = Number(btn.dataset.next);
      state.history.push(state.currentScene);
      state.currentScene = next;
      renderScene();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ---------- 结局场景 ---------- */
function renderEndingScene(scene, coverHtml){
  const wrap = $('#sceneWrap');

  const contentHtml = `
    <div class="ending-content" id="endingContent">
      <div class="ending-text">${T(scene.text)}</div>

      <div class="section-block">
        <div class="s-label">${T(TXT.reflectionLabel)}</div>
        <p>${T(scene.reflection)}</p>
      </div>

      <div class="section-block">
        <div class="s-label">${T(TXT.tipLabel)}</div>
        <p>${T(scene.tip)}</p>
      </div>

      <div class="section-block">
        <div class="s-label">${T(TXT.resourcesLabel)}</div>
        <p style="font-size:12.5px;color:#A2958A;margin-bottom:6px;">${T(TXT.resourcesNote)}</p>
        <ul class="res-list">
          ${RESOURCES.map(r => `
            <li>
              <a class="res-link" href="${r.url}" target="_blank" rel="noopener">
                <span>
                  <span class="r-name">${state.lang === 'zh' ? r.zh : r.en}</span>
                  <span class="r-sub">${r.sub}</span>
                </span>
                <span class="arrow">↗</span>
              </a>
            </li>
          `).join('')}
        </ul>
      </div>

      <div class="ending-actions">
        <button class="btn-ghost" id="btnReplay">${T(TXT.replay)}</button>
        <button class="btn-primary" id="btnBackHome" style="margin-top:0;">${T(TXT.backHome)}</button>
      </div>
    </div>
  `;

    wrap.innerHTML = `
      <div class="ending-wrap">
        ${coverHtml}
        ${contentHtml}
      </div>
    `;
    bindEndingActions();
}

function bindEndingActions(){
  $('#btnReplay').addEventListener('click', () => {
    state.currentScene = 0;
    renderScene();
    window.scrollTo({ top: 0 });
  });
  $('#btnBackHome').addEventListener('click', () => {
    $('#player').classList.remove('active');
    $('#home').classList.add('active');
    state.currentDrama = null;
    window.scrollTo({ top: 0 });
  });
}

/* =====================================================
   11. 初始化
   ===================================================== */
function init(){
  state.lang = 'zh';
  applyStaticLang();
}

init();
</script>
</body>
</html>
